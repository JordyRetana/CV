services:
  - type: web
    name: cvdesktopeditor-license-api
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./server/CVDesktopEditor.Api/Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: SUPABASE_CONNECTION_STRING
        sync: false
      - key: ADMIN_API_KEY
        sync: false
