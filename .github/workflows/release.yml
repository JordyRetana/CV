name: Build and publish desktop release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 0.2.2
        required: true
        type: string
      channel:
        description: Velopack channel
        required: true
        default: stable
        type: choice
        options:
          - stable
          - beta

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Velopack
        run: dotnet tool install -g vpk

      - name: Build Velopack package
        shell: pwsh
        run: ./scripts/build-velopack.ps1 -Version "${{ inputs.version }}" -Channel "${{ inputs.channel }}"

      - name: Upload Velopack release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/upload-velopack-github.ps1 -Version "${{ inputs.version }}" -Channel "${{ inputs.channel }}"
