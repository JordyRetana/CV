name: Check license database

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Query database-backed health endpoint
        run: |
          curl --fail --silent --show-error --max-time 50 \
            --retry 3 --retry-all-errors --retry-delay 10 \
            https://cvdesktopeditor-license-api.onrender.com/health/database
